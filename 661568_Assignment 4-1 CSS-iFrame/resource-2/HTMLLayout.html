<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>HTML Layout</title>
    <!-- Internal style sheet ให้กำหนดเป็นรูปแบบของการสร้างเว็บ -->
    <style>
        div.container {
            width: 100%;
            border: 1px solid red;
        }

        header,
        footer {
            padding: 1em;
            color: white;
            background-color: black;
            clear: left;
            text-align: center;
        }

        nav {
            float: left;
            width: 160px;
            height: 780px;
            margin: 0;
            padding: 1em;
            background-color: #FFCCFF;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
        }

        nav ul a {
            text-decoration: none;
        }

        article {
            margin-left: 170px;
            border-left: 1px solid gray;
            padding: 1em;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <!-- tag <div> โดย class คือ container ใช้กับ internal style sheet -->
    <div class="container">
        <header>
            <h1>My Web Site</h1>
        </header>

        <nav>
            <h1>Menu List</h1>
            <ul>
                <li><a href="home.html" target="iframe_a"><img src="button/home1.jpg" alt="HOME"></a></li>
                <li><a href="List.html" target="iframe_a"><img src="button/index1.jpg" alt="STUDY"></a></li>
                <li><a href="testTable.html" target="iframe_a"><img src="button/gallery1.jpg" alt="GALLEY"></a></li>
                <li><a href="index.html" target="iframe_a"><img src="button/video1.jpg" alt="VIDEO"></a></li>
                <li><a href="webvideo.html" target="iframe_a"><img src="button/contact1.jpg" alt="CONTACT"></a></li>
                <li><a href="viewBuild/album/index.html" target="iframe_a"><img src="button/gallery1.jpg"
                            alt="GALLEY"></a></li>
                <li><a href="https://www.google.com/" target="_blank"><img src="button/google.png" alt="Google"></a>
                </li>
            </ul>
        </nav>

        <article>
            <iframe height="800px" width="100%" src="index.html" name="iframe_a" style="border:none;"></iframe>
        </article>

        <footer>Copyright &copy; PEERATUT WARITUM</footer>
    </div>
</body>

</html>
