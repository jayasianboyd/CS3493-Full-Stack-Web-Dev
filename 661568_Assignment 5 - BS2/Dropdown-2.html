<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css" rel="stylesheet"> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script> -->

    <link href="./bootstrap-5.1.0-dist/bootstrap-5.1.0-dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="./bootstrap-5.1.0-dist/bootstrap-5.1.0-dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="p-4">
    <!-- Row 1 -->
    <div class="d-flex justify-content-between mb-3">
        <!-- Left Side -->
        <div>
            <!-- Default dropend button -->
            <div class="btn-group dropend me-2">
                <button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">
                    Dropend
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Angular</a></li>
                    <li><a class="dropdown-item" href="#">React</a></li>
                    <li><a class="dropdown-item" href="#">Vue</a></li>
                </ul>
            </div>
            <!-- Split dropend button -->
            <div class="btn-group dropend">
                <button type="button" class="btn btn-danger">
                    Split dropend
                </button>
                <button type="button" class="btn btn-danger dropdown-toggle dropdown-toggle-split"
                    data-bs-toggle="dropdown">
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Angular</a></li>
                    <li><a class="dropdown-item" href="#">React</a></li>
                    <li><a class="dropdown-item" href="#">Vue</a></li>
                </ul>
            </div>
        </div>

        <!-- Right Side -->
        <div class="mt-5">
            <!-- Default dropstart button -->
            <div class="btn-group dropstart me-2">
                <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown">
                    Dropstart
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="#">Action</a></li>
                    <li><a class="dropdown-item" href="#">Another action</a></li>
                    <li><a class="dropdown-item" href="#">Something else here</a></li>
                </ul>
            </div>
            <!-- Split dropstart button -->
            <div class="btn-group">
                <div class="btn-group dropstart" role="group">
                    <button class="btn btn-dark dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown">
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#">Action</a></li>
                        <li><a class="dropdown-item" href="#">Another action</a></li>
                        <li><a class="dropdown-item" href="#">Something else here</a></li>
                    </ul>
                </div>
                <button type="button" class="btn btn-dark">
                    Split dropstart
                </button>
            </div>
        </div>
    </div>

    <!-- Row 2 -->
    <div class="mt-5">
        <!-- dropup button -->
        <div class="btn-group dropup me-2">
            <button class="btn btn-info dropdown-toggle" data-bs-toggle="dropdown">
                Dropup
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Angular</a></li>
                <li><a class="dropdown-item" href="#">React</a></li>
                <li><a class="dropdown-item" href="#">Vue</a></li>
            </ul>
        </div>
        <!-- Split dropup button -->
        <div class="btn-group dropup">
            <button class="btn btn-secondary">
                Split dropup
            </button>
            <button class="btn btn-secondary dropdown-toggle dropdown-toggle-split" data-bs-toggle="dropdown">
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Angular</a></li>
                <li><a class="dropdown-item" href="#">React</a></li>
                <li><a class="dropdown-item" href="#">Vue</a></li>
            </ul>
        </div>
    </div>
</body>

</html>
